# CI for dora-bio/ (DORA v2.0-bio). It runs the same brick gates as a local `./bricks.sh`, so "green locally"
# and "green in CI" mean the same thing. See dora-bio/PATHWAY.md (phase P1) and dora-bio/bricks.sh.
# The v1 project at the repo root has no tests and is not built here.
name: dora-bio gates

# Spend policy (enforced by gate 9): CI runs where it adds information, not on every working-branch push.
#   - PRs into main and pushes to main: the merge gate.
#   - Manual "Run workflow" (workflow_dispatch) when a check on a working branch is wanted.
#   - Never for docs-only changes. On working branches, the local ./bricks.sh is the gate (same gates).
on:
  push:
    branches: [main]
    paths:
      - "dora-bio/**"
      - "!dora-bio/**/*.md"
      - ".github/workflows/dora-bio.yml"
  pull_request:
    branches: [main]
    paths:
      - "dora-bio/**"
      - "!dora-bio/**/*.md"
      - ".github/workflows/dora-bio.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an in-progress run obsolete.
concurrency:
  group: dora-bio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: "Bricks 0-10 + gate self-test (gate 8 runs in godot-smoke)"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dora-bio
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML (gates 9-10 check this workflow file)
        run: python -m pip install pyyaml==6.0.2
      # The full run: gate 8 reports SKIPPED here (no Godot in this job), and gate 9 includes the self-test that
      # plants one bug per gate 0-7 and requires each to turn red.
      - name: All gates
        run: ./bricks.sh

  godot-smoke:
    name: "Brick 8: headless Godot smoke test"
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dora-bio
    env:
      # Must equal the Godot.NET.Sdk version in dora-bio/godot/DoraBio.Godot.csproj (gate 10 checks this).
      GODOT_VERSION: "4.5.1"
      # SHA-512 of Godot_v4.5.1-stable_mono_linux_x86_64.zip, from SHA512-SUMS.txt of the official 4.5.1-stable release.
      GODOT_SHA512: "3823b13bba75ab5be49acf995137fff4609baace1ffdfb9ed359e0f75ab6f6be31d587370930e98521d8754ac7b2728c31aae8e972cc6a88752657df72a8fe89"
      # A missing Godot must fail here, never SKIP.
      REQUIRE_GODOT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-${{ env.GODOT_SHA512 }}
      - name: Download Godot (verified against the pinned SHA-512)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          mkdir -p ~/godot && unzip -q godot.zip -d ~/godot
      - name: Gate 8 (import the project, then run tests/smoke_test.tscn headless)
        run: |
          export GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          ./bricks.sh --only 8
